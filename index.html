<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鬼夜哭</title>
<meta name="description" content="造字肉鸽：把字根拼成字，把鬼写哭。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #0b0e13; --bg2: #131821; --bg3: #1b212c; --line: #2b3340; --text: #d9d3c3; --dim: #8a8f99;
  --paper: #e9e0ca; --paper2: #cfc3a4; --ink: #15171b; --red: #c9402f; --gold: #dcb65e; --ghost: #d5e6ee;
  --F: #de5a44; --W: #5a9bd0; --M: #68a86c; --J: #d9b45c; --T: #b58a57; --N: #9aa0aa;
  --brush: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--serif); font-size: 15px; line-height: 1.6; overflow: hidden; }
body { background: radial-gradient(900px 600px at 82% -8%, #24304166, transparent 70%), radial-gradient(700px 500px at 10% 110%, #2a1a1855, transparent 70%), var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
small { font-size: .8em; color: var(--dim); }
#bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; transition: opacity .6s; } body.run #bg { opacity: .45; }
#bg i { position: absolute; font: normal 90px var(--brush); color: var(--ghost); opacity: 0; filter: blur(2px); animation: drift 26s linear infinite; }
@keyframes drift { 0% { transform: translateY(30px); opacity: 0; } 20% { opacity: .07; } 80% { opacity: .07; } 100% { transform: translateY(-90px); opacity: 0; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
#float { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
#app { position: relative; height: 100%; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; padding: 0 16px; }
.body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 0 24px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

/* 按钮 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 20px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg2); color: var(--text); transition: .15s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--paper2); background: var(--bg3); }
.btn:disabled { opacity: .4; }
.btn.red { background: var(--red); border-color: var(--red); color: #fff3e6; }
.btn.red:hover:not(:disabled) { background: #dc4c39; border-color: #dc4c39; }
.btn.sm { padding: 4px 12px; font-size: 13px; }

/* 顶栏 */
.hud { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); flex: none; min-height: 50px; }
.hud > span { white-space: nowrap; }
.hud i { font-style: normal; display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; font-size: 12px; margin-right: 5px; vertical-align: 2px; }
.hud .hp i { background: var(--red); color: #fff; } .hud .hp { font-weight: 600; }
.hud .gold i { background: var(--gold); color: var(--ink); } .hud .gold { color: var(--gold); font-weight: 600; }
.hud .where { color: var(--dim); font-size: 13px; }
.hud .boon { color: var(--paper2); font-size: 13px; border-bottom: 1px dotted var(--dim); }
.hud .relics { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
.relic { display: inline-block; width: 24px; height: 24px; line-height: 22px; text-align: center; border: 1px solid var(--red); color: #ef8d7d; border-radius: 3px; font: 15px/22px var(--brush); }
.hud .btn { padding: 4px 11px; font-size: 13px; }

/* 字根牌 */
.card { position: relative; width: 62px; height: 82px; border-radius: 4px; background: linear-gradient(160deg, var(--paper), var(--paper2)); color: var(--ink); font: 44px/80px var(--brush); text-align: center; box-shadow: 0 2px 0 #0008, inset 0 0 0 1px #fff5; transition: transform .12s, box-shadow .12s, opacity .2s; flex: none; user-select: none; }
.card::after { content: ""; position: absolute; left: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--c, transparent); }
.card.up { box-shadow: 0 2px 0 #0008, inset 0 0 0 2px var(--red); }
.card.up::before { content: "朱"; position: absolute; right: 3px; bottom: 3px; width: 15px; height: 15px; font: 10px/15px var(--serif); color: #fff; background: var(--red); border-radius: 2px; }
.card.tmp { opacity: .82; outline: 1px dashed var(--ink); outline-offset: -5px; }
.card.sel { transform: translateY(-16px); box-shadow: 0 0 0 2px var(--gold), 0 10px 18px #000a; }
.card.sealed { filter: grayscale(1) brightness(.5); }
.card.sealed::before { content: "封"; position: absolute; inset: 0; font: 26px/82px var(--brush); color: #ff8a78; background: none; width: auto; height: auto; }
.card.bad { background: linear-gradient(160deg, #8d8577, #6c655a); color: #2a2320; }
.card.used { opacity: 0; transform: translateY(-40px) scale(.8); }
.card.sm { width: 44px; height: 58px; font-size: 31px; line-height: 57px; }
.card.sm::after { left: 4px; top: 4px; width: 5px; height: 5px; }
button.card:hover:not(.sealed):not(.sel) { transform: translateY(-5px); }
.el-F { --c: var(--F); } .el-W { --c: var(--W); } .el-M { --c: var(--M); } .el-J { --c: var(--J); } .el-T { --c: var(--T); } .el- { --c: transparent; }

/* 标题 */
.title { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 20px 0; }
.title h1 { margin: 0; font: normal 132px/1 var(--brush); color: var(--ghost); letter-spacing: .06em; text-shadow: 0 0 34px #9cc4d855, 0 0 3px #fff8; display: flex; gap: .08em; }
.title h1 span { display: inline-block; animation: sway 5s ease-in-out infinite; } .title h1 span:nth-child(2) { animation-delay: -1.6s; } .title h1 span:nth-child(3) { animation-delay: -3.1s; color: #f0a092; text-shadow: 0 0 34px #c9402f77; }
@keyframes sway { 50% { transform: translateY(-7px) rotate(-1.2deg); } }
.title .quote { color: var(--dim); letter-spacing: .12em; } .title .quote small { display: block; margin-top: 4px; }
.title .sub { margin: 0; color: var(--paper2); letter-spacing: .2em; }
.title .menu { display: flex; flex-direction: column; gap: 10px; width: 230px; margin-top: 8px; }
.title .menu .btn { justify-content: space-between; }
.title .menu .btn.red { justify-content: center; font-size: 17px; letter-spacing: .3em; padding: 12px; }
.title .foot { color: var(--dim); font-size: 13px; min-height: 20px; }

h2 { font: normal 30px var(--brush); margin: 4px 0 2px; color: var(--paper); letter-spacing: .08em; }
h3 { font-size: 13px; font-weight: 400; color: var(--dim); margin: 18px 0 8px; letter-spacing: .15em; display: flex; align-items: center; gap: 10px; }
h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.lead { color: var(--dim); margin: 0 0 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opt { text-align: left; padding: 13px 15px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg2); transition: .15s; display: block; width: 100%; }
.opt:hover:not(:disabled) { border-color: var(--paper2); }
.opt.on { border-color: var(--gold); background: #2a2516; }
.opt:disabled { opacity: .42; }
.opt b { font: normal 23px var(--brush); color: var(--paper); margin-right: 8px; } .opt p { margin: 3px 0 0; color: var(--dim); font-size: 13.5px; }
.opt .mini { display: flex; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
.mini span { width: 23px; height: 28px; background: var(--paper); color: var(--ink); font: 18px/28px var(--brush); text-align: center; border-radius: 2px; }
.foot-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; } .stepper b { color: var(--text); min-width: 1.2em; text-align: center; }

/* 地图 */
.mapwrap { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.map { display: block; width: 100%; max-width: 560px; margin: 0 auto; }
.map .ed { stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 6; fill: none; }
.map .ed.on { stroke: var(--paper2); stroke-dasharray: none; opacity: .8; } .map .ed.can { stroke: var(--gold); opacity: .8; }
.map .nd circle { fill: var(--bg2); stroke: var(--line); stroke-width: 1.5; }
.map .nd text { font: 20px var(--brush); fill: var(--dim); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.map .nd.t-X text { fill: #ef8d7d; } .map .nd.t-S text { fill: var(--gold); } .map .nd.t-R text { fill: var(--M); } .map .nd.t-E text { fill: var(--W); }
.map .nd.done circle { fill: var(--paper2); stroke: var(--paper2); } .map .nd.done text { fill: var(--ink); }
.map .nd.now circle { stroke: var(--paper); stroke-width: 3; }
.map .nd.can { cursor: pointer; } .map .nd.can circle { stroke: var(--gold); stroke-width: 2.5; animation: pulse 1.6s ease-in-out infinite; } .map .nd.can text { fill: var(--paper); }
.map .nd.can:hover circle { fill: #3a3118; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.map .boss circle { fill: #2a1512; stroke: var(--red); } .map .boss text { font-size: 42px; fill: #f0a092; }
.map .lbl { font: 12px var(--serif); fill: var(--dim); text-anchor: middle; }
.legend { display: flex; gap: 14px; justify-content: center; color: var(--dim); font-size: 12.5px; padding: 8px 0 10px; flex-wrap: wrap; flex: none; }
.legend b { font: 15px var(--brush); color: var(--text); margin-right: 3px; }

/* 战斗 */
.battle { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.foes { flex: 1; min-height: 150px; display: flex; justify-content: center; align-items: center; gap: clamp(6px, 3vw, 34px); padding: 6px 0; }
.foe { position: relative; width: 150px; text-align: center; padding: 6px 4px 8px; border-radius: 6px; border: 1px solid transparent; transition: border-color .15s, opacity .4s, transform .4s, filter .4s; cursor: pointer; }
.foe.tg { border-color: #dcb65e66; background: #dcb65e0a; }
.foe.tg::before { content: "▾"; position: absolute; top: -13px; left: 0; right: 0; color: var(--gold); font-size: 13px; }
.foe .glyph { font: 104px/1.08 var(--brush); color: var(--ghost); text-shadow: 0 0 26px #a8cfe266, 0 0 2px #fff; animation: hover 4.2s ease-in-out infinite; }
.foe.boss .glyph { font-size: 136px; color: #f4c9bf; text-shadow: 0 0 34px #c9402f88, 0 0 2px #fff; } .foe.boss { width: 220px; }
.foe.elite .glyph { color: #f1dfb2; text-shadow: 0 0 26px #dcb65e77, 0 0 2px #fff; }
.foe.small .glyph { font-size: 64px; } .foe.small { width: 96px; }
.foe:nth-child(2) .glyph { animation-delay: -1.3s; } .foe:nth-child(3) .glyph { animation-delay: -2.6s; }
@keyframes hover { 50% { transform: translateY(-6px); } }
.foe.shake .glyph { animation: shake .28s; } @keyframes shake { 20% { transform: translate(-7px, 2px) rotate(-3deg); } 50% { transform: translate(6px, -2px) rotate(2deg); } 80% { transform: translate(-3px, 1px); } }
.foe.lunge .glyph { animation: lunge .34s; } @keyframes lunge { 40% { transform: translateY(34px) scale(1.14); } }
.foe.dying { opacity: 0; transform: translateY(-24px) scale(1.25); filter: blur(10px); pointer-events: none; }
.foe.dead { visibility: hidden; }
.foe.spawn { animation: fadein .4s; } @keyframes fadein { from { opacity: 0; transform: scale(.6); } }
.intent { display: inline-flex; gap: 6px; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; background: var(--bg3); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.intent b { color: #ff9a86; font-weight: 600; } .intent em { font-style: normal; color: var(--paper2); } .intent.stun { color: var(--dim); }
.fname { font-size: 13px; color: var(--dim); } .fname em { font-style: normal; font-size: 11.5px; margin-left: 5px; padding: 0 4px; border-radius: 2px; border: 1px solid; color: var(--c); }
.hpbar { position: relative; text-align: center; height: 15px; margin: 4px auto 0; max-width: 150px; background: #000a; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.hpbar i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(#b23a2c, #8c2a20); transition: width .25s; }
.hpbar span { position: relative; font-size: 11px; line-height: 13px; display: block; color: #fff; text-shadow: 0 1px 1px #000; }
.sts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 5px; min-height: 21px; }
.st { font-size: 12px; line-height: 19px; padding: 0 6px; border-radius: 2px; background: var(--bg3); border: 1px solid var(--line); white-space: nowrap; }
.st.good { border-color: #68a86c88; color: #a5d6a8; } .st.bad { border-color: #c9402f88; color: #f0a092; } .st.blk { border-color: #5a9bd088; color: #a9cfee; } .st.nx { border-style: dashed; color: var(--dim); }

.me { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
.me .hpbar { width: 170px; max-width: 40vw; margin: 0; height: 18px; flex: none; } .me .hpbar span { line-height: 16px; font-size: 12px; }
.me .sts { margin: 0; justify-content: flex-start; flex: 1; }
.ally { font: 17px/24px var(--brush); width: 26px; height: 26px; text-align: center; border-radius: 50%; border: 1px solid var(--gold); color: var(--gold); display: inline-block; }

.desk { flex: none; background: var(--bg2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-height: 104px; display: flex; gap: 12px; align-items: stretch; }
.desk .hintbox { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { font: 21px/30px var(--brush); width: 34px; height: 34px; border-radius: 3px; border: 1px solid var(--line); background: var(--bg3); color: var(--paper); text-align: center; position: relative; }
.chip:hover { border-color: var(--gold); } .chip.n3 { border-color: #dcb65e88; } .chip.hintd { border-style: dashed; color: var(--gold); }
.chip.el-F, .chip.el-W, .chip.el-M, .chip.el-J, .chip.el-T { box-shadow: inset 0 -2px 0 var(--c); }
.unk { color: var(--gold); font-size: 13px; } .muted { color: var(--dim); font-size: 13px; }
.res { flex: 1; min-width: 0; display: flex; gap: 12px; align-items: center; text-align: left; padding: 4px 8px 4px 4px; border-radius: 5px; border: 1px solid transparent; transition: .12s; }
button.res:hover:not(:disabled) { border-color: var(--gold); background: #dcb65e12; }
.res .big { flex: none; width: 76px; height: 76px; border-radius: 5px; background: linear-gradient(160deg, var(--paper), var(--paper2)); color: var(--ink); font: 58px/74px var(--brush); text-align: center; box-shadow: inset 0 -4px 0 var(--c, transparent); position: relative; }
.res .big.new::after { content: "新"; position: absolute; right: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--red); color: #fff; font: 12px/20px var(--serif); }
.res .txt { min-width: 0; } .res .txt b { color: var(--paper); font-weight: 600; } .res .txt b small { margin-left: 8px; font-weight: 400; }
.res .txt p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.5; } .res .txt .note { color: var(--dim); font-size: 12px; }
.res .go { flex: none; margin-left: auto; padding: 6px 13px; border-radius: 3px; background: var(--red); color: #fff3e6; font-size: 14px; letter-spacing: .2em; }
.res:disabled .go { background: var(--line); color: var(--dim); }
.res.nope { justify-content: center; color: var(--dim); } .res.wig { animation: shake .25s; }
.resl { flex: 1; min-width: 0; display: flex; gap: 6px; flex-direction: column; justify-content: center; }
.resl.multi .res { padding: 2px 8px 2px 2px; } .resl.multi .big { width: 46px; height: 46px; font-size: 34px; line-height: 45px; } .resl.multi .txt p { font-size: 13px; }
.gl { font-size: 12px; color: var(--dim); margin-top: 3px; } .gl b { color: var(--paper2); font-weight: 400; }

.handbar { flex: none; display: flex; align-items: flex-end; gap: 12px; padding: 24px 0 14px; }
.hand { flex: 1; min-width: 0; display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; row-gap: 22px; }
.side { flex: none; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 96px; }
.inks { display: flex; gap: 5px; align-items: center; height: 22px; } .inks i { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--paper2); } .inks i.f { background: var(--paper); box-shadow: 0 0 8px #e9e0ca88; } .inks b { font-size: 13px; color: var(--dim); font-weight: 400; margin-right: 2px; }
.piles { font-size: 12px; color: var(--dim); white-space: nowrap; }
.ask { text-align: center; color: var(--gold); padding: 6px; flex: 1; align-self: center; }

.castglyph { position: absolute; left: 50%; top: 40%; font: 190px/1 var(--brush); color: var(--paper); text-shadow: 0 0 40px var(--c, #fff8), 0 0 4px #000; transform: translate(-50%, -50%); animation: write .62s ease-out forwards; white-space: nowrap; }
.castglyph.sub { font-size: 120px; animation-duration: .45s; } .castglyph small { font: 40px var(--brush); color: var(--gold); margin-left: 6px; }
@keyframes write { 0% { opacity: 0; filter: blur(14px); transform: translate(-50%, -50%) scale(1.7); } 30% { opacity: 1; filter: blur(0); transform: translate(-50%, -50%) scale(1); } 62% { opacity: 1; transform: translate(-50%, -50%) scale(.97); } 100% { opacity: 0; filter: blur(5px); transform: translate(-50%, -78%) scale(.86); } }
.flt { position: absolute; font: 600 24px var(--serif); text-shadow: 0 2px 4px #000, 0 0 2px #000; transform: translate(-50%, -50%); animation: rise .85s ease-out forwards; white-space: nowrap; }
@keyframes rise { 0% { opacity: 0; margin-top: 8px; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; margin-top: -52px; } }
.flt.dmg { color: #fff; } .flt.crit { color: #ffd76a; font-size: 31px; } .flt.res { color: #9aa0aa; font-size: 19px; } .flt.dot { color: #ffab7a; font-size: 19px; }
.flt.pdmg { color: #ff7d6b; font-size: 31px; } .flt.blk { color: #a9cfee; font-size: 19px; } .flt.heal { color: #a5d6a8; } .flt.gold { color: var(--gold); font-size: 19px; }
.flt.note { color: var(--paper); font: 27px var(--brush); } .flt.bad { color: #ff9a86; font: 23px var(--brush); } .flt.name { color: #ffb9a8; font: 23px var(--brush); }
.banner { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); padding: 8px 22px; background: #0b0e13ee; border: 1px solid var(--gold); border-radius: 4px; text-align: center; animation: ban 1.9s ease-out forwards; white-space: nowrap; }
.banner b { font: 33px var(--brush); color: var(--gold); margin: 0 6px; vertical-align: -4px; } .banner small { display: block; color: var(--dim); }
.banner.turn { border-color: var(--line); top: 34%; animation-duration: .95s; color: var(--paper2); letter-spacing: .3em; }
@keyframes ban { 0% { opacity: 0; margin-top: 12px; } 12% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; } }
.quake { animation: quake .3s; } @keyframes quake { 25% { transform: translate(-6px, 3px); } 50% { transform: translate(5px, -3px); } 75% { transform: translate(-3px, 1px); } }

/* 奖励、商店、事件 */
.pick { display: flex; gap: 12px; flex-wrap: wrap; }
.pc { width: 176px; padding: 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg2); text-align: left; display: flex; flex-direction: column; gap: 8px; transition: .15s; }
button.pc:hover:not(:disabled) { border-color: var(--gold); } .pc:disabled { opacity: .4; } .pc.taken { border-color: var(--gold); background: #2a2516; opacity: 1 !important; }
.pc .top { display: flex; gap: 10px; align-items: center; } .pc p { margin: 0; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
.pc .syn { font: 18px var(--brush); color: var(--paper); letter-spacing: 2px; word-break: break-all; } .pc .syn u { text-decoration: none; color: var(--gold); }
.pc .price { color: var(--gold); font-weight: 600; margin-left: auto; white-space: nowrap; } .pc .top > span:nth-child(2) { flex: 1; min-width: 0; } .pc .price.no { color: #f0a092; }
.pc .rn { font: 23px var(--brush); color: #ef8d7d; }
.got { border: 1px solid var(--line); border-left: 3px solid var(--red); padding: 9px 14px; background: var(--bg2); border-radius: 3px; margin: 10px 0; } .got b { color: #ef8d7d; }
.evt { max-width: 620px; margin: 0 auto; } .evt .x { font-size: 16.5px; line-height: 2; color: var(--paper); margin: 12px 0 18px; }

// 鬼夜哭 · 引擎（不碰 DOM，可在 node 里直接跑）

function RNG(seed) {
  let s = seed | 0;
  const f = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.int = n => Math.floor(f() * n);
  f.pick = a => a[f.int(a.length)];
  f.chance = p => f() < p;
  f.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = f.int(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  f.get = () => s; f.set = v => { s = v | 0; };
  return f;
}

      case 'heal': floatAt(me, '+' + ev.n, 'heal', -20); ui.meHp += ev.n; setBar(meRow, ui.meHp, G.max); sfx.heal(); await sleep(60); break;
      case 'gold': if (ev.n) { floatAt($('.hud .gold'), '+' + ev.n, 'gold', 30); sfx.gold(); } break;
      case 'txt': floatAt(ev.p ? me : fe, ev.s, ev.bad ? 'bad' : ev.good ? 'heal' : 'note', ev.p ? -44 : -30); if (ev.bad) sfx.bad(); await sleep(90); break;
      case 'die': if (fe) { fe.classList.add('dying'); splash(fe, '#d5e6ee', 34); } sfx.die(); await sleep(330); break;
      case 'foe': if (fe) { bump(fe, 'lunge'); floatAt(fe, ev.name, 'name', -70); } await sleep(300); break;
      case 'ally': break;
      case 'spawn': render(); await sleep(200); break;
      case 'rain': grainRain(ev.isNew ? 90 : 26); if (ev.isNew) { sfx.newc(); banner(`新字<b>${ev.ch}</b>${CH[ev.ch].comps.join('＋')}<small>天雨粟　粟 +${ev.g}　已收进字典</small>`); await sleep(260); } else sfx.gold(); floatAt($('.hud .gold'), '+' + ev.g, 'gold', 30); break;
      case 'turn': if (ev.n > 1) { sfx.turn(); banner(`第 ${ev.n} 回合`, 'turn'); await sleep(200); } break;
    }
  }
}
async function flush() { busy = true; await play(B.ev.splice(0)); busy = false; render(); after(); }
async function doCast(ch) {
  if (busy || !B || B.over) return;
  const idxs = sel.slice(), els = idxs.map(i => $(`.hand .card[data-i="${i}"]`));
  if (!B.cast(idxs, ch, tgi)) { sfx.nope(); bump($('.res'), 'wig'); return; }
  busy = true; sel = []; els.forEach(e => e && e.classList.add('used'));
  await play(B.ev.splice(0)); busy = false; render(); await after();
}
async function endTurn() {
  if (busy || !B || B.over || B.pending) return;
  busy = true; sel = []; hideTip();
  for (const s of B.endSteps()) { if (s() === false) continue; await play(B.ev.splice(0)); render(); if (B.over) break; }
  busy = false; render(); await after();
}
async function after() {
  if (!B || !B.over) return;
  busy = true;
  if (B.over === 'win') { sfx.win(); await sleep(700); busy = false; const rw = mkReward(G, B); cur = { t: 'reward', rw, kind: B.kind, took: false, relicPick: null }; if (rw.relic) addRelic(G, rw.relic); B = null; go('reward'); }
  else { sfx.lose(); await sleep(1000); busy = false; endRun(G, false); B = null; go('over'); }
}

// ── 战后、墨庄、茶寮、典故
function compCard(c, o) {
  const syn = synergy(G, c.c), kn = syn.filter(known), un = syn.length - kn.length;
  return `<button class="pc ${o.taken ? 'taken' : ''}" data-act="${o.act}" data-i="${o.i}" ${o.disabled ? 'disabled' : ''}>
    <span class="top">${cardHtml(c, 'sm')}<span><p>${descChar(c.c)}</p></span>${o.price != null ? `<span class="price ${G.gold < o.price ? 'no' : ''}">${o.price} 粟</span>` : ''}</span>
    <p>${syn.length ? `配上你手头的字根，可成 ${syn.length} 字：` : '眼下和你的字根拼不出字。'}</p>${syn.length ? `<span class="syn">${kn.slice(0, 16).join('')}${un ? `<u>${'？'.repeat(Math.min(un, 10))}</u>` : ''}</span>` : ''}</button>`;
}
SCR.reward = () => {
  const rw = cur.rw, need = rw.relics && rw.relics.length && !cur.relicPick;
  return `<div class="body"><h2>${cur.kind === 'boss' ? '首领散了' : '写毕'}</h2><p class="lead">粟 +${rw.gold}${cur.kind === 'boss' && G.act < 3 ? '　·　生命回复了四成' : ''}</p>
    ${rw.relic ? `<div class="got">得文房 <b>${RELICS[rw.relic][0]}</b>　${RELICS[rw.relic][1]}</div>` : ''}
    ${rw.relics && rw.relics.length ? `<h3>它留下的文房 · 取一件</h3><div class="pick">${rw.relics.map((id, i) => `<button class="pc ${cur.relicPick === id ? 'taken' : ''}" data-act="rpick" data-i="${i}" ${cur.relicPick ? 'disabled' : ''}><span class="rn">${RELICS[id][0]}</span><p>${RELICS[id][1]}</p></button>`).join('')}</div>` : ''}
    <h3>从它身上拆一张字根</h3><div class="pick">${rw.comps.map((c, i) => compCard(c, { act: 'take', i, taken: cur.took === i, disabled: cur.took !== false })).join('')}</div>
    <div class="foot-bar"><span class="muted">${cur.took === false ? '一张都不拿也行。牌库越薄，越容易凑齐想要的字。' : ''}</span><button class="btn red" data-act="rwdone" ${need ? 'disabled' : ''}>${cur.kind === 'boss' && G.act < 3 ? '翻到下一卷' : '继续'}</button></div></div>`;
};
SCR.shop = () => {
  const s = cur.shop, svc = (k, n, d, p, ok) => `<button class="pc" data-act="svc" data-k="${k}" ${ok && G.gold >= p ? '' : 'disabled'}><span class="top"><span class="rn" style="color:var(--paper)">${n}</span><span class="price ${G.gold < p ? 'no' : ''}">${p} 粟</span></span><p>${d}</p></button>`;
  return `<div class="body"><h2>墨庄</h2><p class="lead">「都是好字。慢慢看。」</p>
    <h3>字根</h3><div class="pick">${s.comps.map((c, i) => (c.sold ? '' : compCard(c, { act: 'buy', i, price: c.price, disabled: G.gold < c.price }))).join('') || '<span class="muted">卖完了。</span>'}</div>
    <h3>文房</h3><div class="pick">${s.relics.map((r, i) => (r.sold ? '' : `<button class="pc" data-act="buyr" data-i="${i}" ${G.gold < r.price ? 'disabled' : ''}><span class="top"><span class="rn">${RELICS[r.id][0]}</span><span class="price ${G.gold < r.price ? 'no' : ''}">${r.price} 粟</span></span><p>${RELICS[r.id][1]}</p></button>`)).join('') || '<span class="muted">卖完了。</span>'}</div>
    <h3>手艺</h3><div class="pick">${svc('rm', '涂去', '从牌库里删掉一张字根', G.rmCost, G.deck.length > 5)}${svc('up', '朱批', '给一张字根批红：所成之字数值 +25%', G.upCost, G.deck.some(c => !c.up && c.c !== '讹'))}${svc('tea', '吃茶', '回复 15 生命', s.tea, G.hp < G.max)}</div>
    <div class="foot-bar"><span></span><button class="btn red" data-act="leave">离开</button></div></div>`;
};
SCR.rest = () => `<div class="body"><div class="evt"><h2>茶寮</h2><p class="x">路边一间茶寮。灯还亮着，炉上的水刚开。</p><div class="opts">
  <button class="opt" data-act="rest" data-k="heal"><b>歇息</b>回复 ${restHeal(G)} 生命</button>
  <button class="opt" data-act="rest" data-k="up" ${G.deck.some(c => !c.up && c.c !== '讹') ? '' : 'disabled'}><b>描红</b>朱批一张字根：所成之字数值 +25%</button>
  <button class="opt" data-act="rest" data-k="rm" ${G.deck.length > 5 ? '' : 'disabled'}><b>涂改</b>从牌库里删掉一张字根</button></div></div></div>`;
SCR.event = () => {
  const ev = cur.ev;
  return `<div class="body"><div class="evt"><h2>${ev.t}</h2><p class="x">${ev.x}</p>${cur.out != null ? `<div class="out">${cur.out}</div><div class="center"><button class="btn red" data-act="leave">继续</button></div>`
    : `<div class="opts">${ev.o.map((o, i) => `<button class="opt" data-act="ev" data-i="${i}" ${o.ok && !o.ok(G) ? 'disabled' : ''}><b>${o.l}</b>${o.d}</button>`).join('')}</div>`}</div></div>`;
};

// ── 字典
SCR.dict = () => {
  const n = dictCount(), ch = ui.dch; let det = `<div class="big u">？</div><div><p>点一个字看它的写法。</p><p class="muted">灰的是还没写过的字。写出来一次，就永远收在这里。</p></div>`;
  if (ch) { const d = CH[ch], k = META.dict[ch], h = META.hint[ch];
    det = k || h ? `<div class="big el-${d.el}">${ch}</div><div><p><b style="color:var(--paper)">${d.comps.join(' ＋ ')}</b>${d.el ? `　<span style="color:var(--${d.el})">${ELN[d.el]}</span>` : ''}　<span class="muted">${d.note}</span></p><p>${descChar(ch)}</p><p class="muted">${k ? '写过 ' + k + ' 次' : '听说过，还没亲手写过'}</p></div>`
      : `<div class="big u">？</div><div><p>还不认得。</p><p class="muted">${d.n} 个字根，其中一个是「${d.comps[(ch.charCodeAt(0) + d.n) % d.n]}」。</p></div>`; }
  const tiles = k => CHARS.filter(c => CH[c[0]].n === k).map(c => { const kn = META.dict[c[0]], h = META.hint[c[0]]; return `<button class="dt ${kn ? 'k' : h ? 'h' : ''} el-${CH[c[0]].el} ${ch === c[0] ? 'on' : ''}" data-act="dsel" data-ch="${c[0]}">${kn || h ? c[0] : '？'}</button>`; }).join('');
  return `<div class="body"><div class="foot-bar" style="margin:0"><h2>字典</h2><button class="btn" data-act="dback">返回</button></div>
    <p class="lead">识字 ${n} / ${TOTAL}</p><div class="bar"><i style="width:${(100 * n) / TOTAL}%"></i></div>
    <div class="ddetail">${det}</div><h3>二部字</h3><div class="dgrid">${tiles(2)}</div><h3>三部字</h3><div class="dgrid">${tiles(3)}</div></div>`;
};

SCR.over = () => {
  const w = G.over === 'win', s = G.st, n = dictCount(), nl = G.newList || [];
  const unl = KITS.filter(k => k.need > 0 && k.need <= n && k.need > n - s.newc);
  return `<div class="over ${w ? 'win' : ''}"><h1>${w ? '字成' : '墨干了'}</h1>
    <p class="lead">${w ? '「忘」散去了。纸上的字，一个都没少。' : `止于${ACTS[G.act][0]}「${ACTS[G.act][1]}」，第 ${G.floor} 步。`}</p>
    <div class="stats"><div><b>${s.chars}</b>写下的字</div><div><b>${Object.keys(G.seenRun).length}</b>不同的字</div><div><b>${s.newc}</b>新识的字</div><div><b>${s.kills}</b>写哭的鬼</div><div><b>${n} / ${TOTAL}</b>字典</div></div>
    ${nl.length ? `<p class="muted">这一局新识的字</p><div class="newc">${nl.join('')}</div>` : ''}
    ${unl.map(k => `<div class="got">解锁新笔 <b>${k.n}</b>　${k.d}</div>`).join('')}
    ${w && G.asc < 9 && META.asc === G.asc + 1 ? `<div class="got">墨阶 <b>${META.asc}</b> 已开　${ASC[META.asc]}</div>` : ''}
    <p class="muted">${KITS[G.kit].n} · ${BOONS[G.boon][0]}${G.asc ? ' · 墨阶 ' + G.asc : ''}　种子 ${G.seed}</p>
    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn red" data-act="new">再写一局</button><button class="btn" data-act="dict">字典</button><button class="btn" data-act="home">回封面</button></div></div>`;
};

// ───────── 动作
function toMap() { cur = {}; saveRun(G); go('map'); }
const ACT = {
  close: closeModal, help, deck: deckModal, menu: menuModal,
  mute() { META.mute = !META.mute; saveMeta(); if (modalEl.classList.contains('on')) menuModal(); else render(); },
  home() { closeModal(); go('title'); },
  new() { closeModal(); openPick(); },
  resume() { G = loadRun(); if (!G) return render(); B = null; cur = {}; go('map'); },
  quit() { closeModal(); endRun(G, false); B = null; go('over'); },
  pkit(d) { ui.pick.kit = +d.i; sfx.tap(+d.i); render(); },
  pboon(d) { ui.pick.boon = d.id; sfx.tap(3); render(); },
  asc(d) { ui.pick.asc = Math.max(0, Math.min(META.asc, ui.pick.asc + +d.d)); render(); },
  start() { const p = ui.pick; if (p.kit == null || !p.boon) return; META.lastAsc = p.asc; saveMeta(); clearRun(); G = newRun({ kit: p.kit, boon: p.boon, asc: p.asc, seed: QS.has('seed') ? +QS.get('seed') : undefined }); G.newList = []; B = null; toMap(); },
  go(d) {
    if (busy) return; const v = visit(G, d.id); cur = v; sel = []; tgi = 0;
    if (v.t === 'battle') { B = v.B; ui.sorted = -1; go('battle'); const e = B.en[0]; if (e.d.boss || e.d.elite) banner(`<b>${e.ch}</b><small>${e.n}</small>`); if (!META.tut) { META.tut = 1; saveMeta(); help(); } }
    else { cur.out = null; go(v.t); }
  },
  card(d) {
    if (busy || !B) return; const i = +d.i;
    if (B.pending) { if (B.choose(i)) flush(); else sfx.nope(); return; }
    const c = B.hand[i]; if (!c || c.sealed) { sfx.nope(); return; }
    const k = sel.indexOf(i); if (k >= 0) sel.splice(k, 1); else { if (sel.length >= 3) sel.shift(); sel.push(i); }
    sfx.tap(i); render();
  },
  chip(d) { if (busy) return; sel = d.i.split(',').map(Number); sfx.tap(sel[0]); render(); },
  foe(d) { if (busy) return; tgi = +d.i; render(); },
  cast(d) { doCast(d.ch); },
  end() { endTurn(); },
  take(d) { if (cur.took !== false) return; const c = cur.rw.comps[+d.i]; G.deck.push({ c: c.c, up: c.up }); cur.took = +d.i; sfx.tap(4); render(); },
  rpick(d) { if (cur.relicPick) return; const id = cur.rw.relics[+d.i]; addRelic(G, id); cur.relicPick = id; sfx.gold(); render(); },
  rwdone() { if (cur.kind === 'boss') { if (G.act === 3) { endRun(G, true); sfx.win(); grainRain(160); return go('over'); } nextAct(G); } toMap(); },
  buy(d) { const c = cur.shop.comps[+d.i]; if (c.sold || G.gold < c.price) return; G.gold -= c.price; G.deck.push({ c: c.c, up: c.up }); c.sold = true; sfx.gold(); render(); },
  buyr(d) { const r = cur.shop.relics[+d.i]; if (r.sold || G.gold < r.price) return; G.gold -= r.price; addRelic(G, r.id); r.sold = true; sfx.gold(); render(); },
  svc(d) {
    const k = d.k, s = cur.shop;
    if (k === 'tea') { if (G.gold < s.tea) return; G.gold -= s.tea; G.hp = Math.min(G.max, G.hp + 15); sfx.heal(); render(); }
    else if (k === 'rm') pickCard('涂去哪一张', null, i => { if (G.gold < G.rmCost) return; G.gold -= G.rmCost; G.rmCost += 20; G.deck.splice(i, 1); render(); });
    else pickCard('朱批哪一张', c => !c.up && c.c !== '讹', i => { if (G.gold < G.upCost) return; G.gold -= G.upCost; G.upCost += 15; G.deck[i].up = true; render(); });
  },
  rest(d) {
    if (d.k === 'heal') { G.hp = Math.min(G.max, G.hp + restHeal(G)); sfx.heal(); toMap(); }
    else if (d.k === 'up') pickCard('描哪一张', c => !c.up && c.c !== '讹', i => { G.deck[i].up = true; toMap(); });
    else pickCard('涂掉哪一张', null, i => { G.deck.splice(i, 1); toMap(); });
  },
  ev(d) { const o = cur.ev.o[+d.i]; if (o.ok && !o.ok(G)) return; if (o.pick) pickCard(o.l, o.pf, i => { cur.out = o.f(G, i); render(); }); else { cur.out = o.f(G); render(); } },
  leave() { toMap(); },
  pk(d) { const cb = ui.pickCb; closeModal(); if (cb) cb(+d.i); },
  dict() { closeModal(); ui.dictBack = scr === 'dict' ? ui.dictBack : scr; ui.dch = null; go('dict'); },
  dback() { go(ui.dictBack || 'title'); },
  dsel(d) { ui.dch = d.ch; const b = $('.body'), t = b ? b.scrollTop : 0; render(); if ($('.body')) $('.body').scrollTop = t; },
};
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) f(el.dataset, el); });
document.addEventListener('keydown', e => {
  if (modalEl.classList.contains('on')) { if (e.key === 'Escape' || e.key === 'Enter') closeModal(); return; }
  if (scr !== 'battle' || !B || busy) return;
  if (/^[0-9]$/.test(e.key)) { const i = e.key === '0' ? 9 : +e.key - 1; if (B.hand[i]) ACT.card({ i }); }
  else if (e.key === 'Enter') { const r = $('.res[data-act="cast"]:not([disabled])'); if (r) doCast(r.dataset.ch); }
  else if (e.key === ' ' || e.key === 'e') { e.preventDefault(); endTurn(); }
  else if (e.key === 'Escape') { sel = []; render(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Tab') { e.preventDefault(); const a = B.en.map((x, i) => i).filter(i => B.en[i].alive), k = a.indexOf(tgi), d = e.key === 'ArrowLeft' ? -1 : 1; tgi = a[(k + d + a.length) % a.length]; render(); }
});

// ───────── 背景、启动
(function () { const bg = $('#bg'), cs = '鬼魂魄魅魔魇魃魍魉魑忘妖怨'; let h = ''; for (let i = 0; i < 12; i++) h += `<i style="left:${(i * 8.3 + Math.random() * 5).toFixed(1)}%;top:${(8 + Math.random() * 78).toFixed(1)}%;animation-delay:-${(Math.random() * 26).toFixed(1)}s;font-size:${60 + ((Math.random() * 70) | 0)}px">${cs[i]}</i>`; bg.innerHTML = h; })();

async function autoPlay() { // ?auto：机器人从界面上把一整局点完，冒烟测试用
  SPEED = 0;
  for (let n = 0; n < 6000; n++) {
    await new Promise(r => setTimeout(r, 0)); if (busy) continue;
    if (modalEl.classList.contains('on')) { const b = $('#modal [data-act="pk"]:not([disabled])') || $('#modal [data-act="close"]'); b.click(); continue; }
    if (scr === 'title') ACT.new();
    else if (scr === 'pick') { ui.pick.kit = ui.pick.kits[n % ui.pick.kits.length]; ui.pick.boon = ui.pick.boons[0]; ACT.start(); }
    else if (scr === 'map') { const c = choices(G); ACT.go({ id: c[(Math.random() * c.length) | 0] }); }
    else if (scr === 'battle') {
      if (B.pending) { ACT.card({ i: B.hand.findIndex(c => c.c !== '讹') }); continue; }
      const o = B.canCast() && B.options().filter(() => B.costOf() <= B.ink).sort((a, b) => CH[b.ch].n - CH[a.ch].n)[0];
      if (o) { sel = o.idxs.slice(); tgi = B.en.findIndex(e => e.alive); render(); await doCast(o.ch); } else await endTurn();
    } else if (scr === 'reward') { if (cur.rw.relics && cur.rw.relics.length && !cur.relicPick) ACT.rpick({ i: 0 }); if (cur.took === false) ACT.take({ i: 0 }); ACT.rwdone(); }
    else if (scr === 'shop') { const b = $('[data-act="buy"]:not([disabled])'); if (b && n % 2) b.click(); else ACT.leave(); }
    else if (scr === 'rest') ACT.rest({ k: ['heal', 'up', 'rm'][n % 3] });
    else if (scr === 'event') { if (cur.out != null) ACT.leave(); else { const ok = cur.ev.o.map((o, i) => i).filter(i => !cur.ev.o[i].ok || cur.ev.o[i].ok(G)); ACT.ev({ i: ok[n % ok.length] }); } }
    else if (scr === 'over') { window.__done = { win: G.over === 'win', act: G.act, floor: G.floor, chars: G.st.chars }; return; }
  }
  window.__done = { stuck: scr };
}
function demo(what) { // ?demo=battle|boss|map|reward|shop|rest|event|pick|over：直接摆出某个画面，截图用
  const seed = +(QS.get('seed') || 7), kit = +(QS.get('kit') || 0);
  if (what === 'pick') return openPick();
  G = newRun({ seed, kit, boon: QS.get('boon') || 'bowen' }); G.newList = [];
  if (what === 'map') { visit(G, choices(G)[0]); visit(G, choices(G)[0]); return go('map'); }
  if (what === 'battle' || what === 'boss' || what === 'reward' || what === 'over') {
    if (what === 'boss') { G.act = 2; G.map = genMap(G); G.relics.push('langhao', 'zitie', 'huimo'); G.deck.push({ c: '日' }, { c: '月', up: true }, { c: '心' }); }
    const v = visit(G, what === 'boss' ? 'boss' : choices(G)[1] || choices(G)[0]); B = v.B; cur = v; scr = 'battle';
    if (what === 'battle') { B.block(6); B.fst(B.en[0], 'burn', 4); B.fst(B.en[0], 'vul', 2); B.allies.push('猫'); B.ev = []; B.hand.sort(byComp); ui.sorted = B.turn; const o = B.options().filter(o => CH[o.ch].n === 2)[0]; if (o) sel = o.idxs.slice(); }
    if (what === 'reward') { B.en.forEach(e => B.kill(e)); B.ev = []; cur = { t: 'reward', rw: mkReward(G, B), kind: 'normal', took: false }; B = null; scr = 'reward'; }
    if (what === 'over') { B = null; G.st = { turns: 40, kills: 23, chars: 88, newc: 3 }; G.seenRun = { 明: 1, 炎: 1, 休: 1 }; G.newList = ['明', '炎', '休']; endRun(G, false); scr = 'over'; }
    return render();
  }
  if (what === 'shop') { cur = { t: 'shop', shop: mkShop(G) }; G.gold = 120; return go('shop'); }
  if (what === 'rest') return go('rest');
  if (what === 'event') { cur = { t: 'event', ev: EVENTS[+(QS.get('i') || 0)], out: null }; return go('event'); }
  if (what === 'dict') { ui.dictBack = 'title'; return go('dict'); }
}
if (QS.has('demo')) demo(QS.get('demo')); else render();
if (QS.has('auto')) autoPlay();
</script>
